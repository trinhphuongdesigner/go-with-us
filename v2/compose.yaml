name: careermate-v2

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: careermate
      POSTGRES_PASSWORD: careermate
      POSTGRES_DB: careermate_v2
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careermate -d careermate_v2"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - careermate-v2-postgres:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro

volumes:
  careermate-v2-postgres:
